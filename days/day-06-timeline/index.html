<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 06 — Timeline 串接 + position parameter</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- GSAP + Vue 3 都用 CDN，不需要 build 工具 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <!-- 三步接力：A 滑入 → B 淡入 → C 一排 stagger 進場 -->
    <div class="stage">
      <div class="track">
        <span class="tag">A</span>
        <div class="box box-a"></div>
      </div>
      <div class="track">
        <span class="tag">B</span>
        <div class="box box-b"></div>
      </div>
      <div class="track">
        <span class="tag">C</span>
        <div class="row">
          <!-- C 是一排 5 顆，用 stagger 進場：這格長度會連 stagger 一起算 -->
          <div class="cell" v-for="n in 5" :key="n"></div>
        </div>
      </div>
    </div>

    <!-- 目前模式對應的 timeline 程式碼，會即時更新 -->
    <pre class="config">{{ config }}</pre>

    <!-- 控制群組：切換 position parameter 的五種寫法 -->
    <div class="controls">
      <span class="controls-title">position parameter 模式</span>
      <div class="btn-group">
        <button
          v-for="m in modes"
          :key="m.value"
          class="btn"
          :class="{ 'is-active': mode === m.value }"
          @click="pickMode(m.value)"
        >{{ m.label }}</button>
      </div>
    </div>

    <button class="replay" @click="play">↻ 重播</button>
  </div>

  <script src="./main.js"></script>
</body>
</html>
